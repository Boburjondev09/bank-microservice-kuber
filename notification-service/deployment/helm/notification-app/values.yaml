replicaCount: 1
image:
  repository: notification-app
  pullPolicy: IfNotPresent
  tag: "1.0"
containerPort: 5005
servicePort: 5005
config:
  APP_ENV: "dev"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://host.docker.internal:5432/notification_db"
  SPRING_DATASOURCE_USERNAME: "arm7"
  SPRING_DATASOURCE_PASSWORD: "arm7k@fk@!"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://host.docker.internal:8761/eureka/"
  EUREKA_INSTANCE_HOSTNAME: "host.docker.internal"
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_USERNAME: "bank@gmail.com"
  MAIL_PASSWORD: "secret"
service:
  type: ClusterIP
ingress:
  enabled: true
  host: notificationapp.local
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
livenessProbe:
  path: /actuator/health
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  path: /actuator/health
  initialDelaySeconds: 5
  periodSeconds: 5
