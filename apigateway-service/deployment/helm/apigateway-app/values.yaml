replicaCount: 1
image:
  repository: apigateway-app
  pullPolicy: IfNotPresent
  tag: "1.0"
containerPort: 8080
servicePort: 8080
config:
  APP_ENV: "dev"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://host.docker.internal:8761/eureka/"
  EUREKA_INSTANCE_HOSTNAME: "host.docker.internal"
service:
  type: LoadBalancer
ingress:
  enabled: true
  host: bankgateway.local
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
livenessProbe:
  path: /actuator/health
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  path: /actuator/health
  initialDelaySeconds: 5
  periodSeconds: 5
